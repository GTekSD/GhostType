<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostType - GTekSD</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="main-content">
    <div class="input-fields-header">
      <span>Text Snippets</span>
      <button type="button" id="clearAllTextsBtn" class="clear-all-snippets-btn" title="Clear the contents of all text snippets" aria-label="Clear all text snippets" disabled>Clear all</button>
      <label class="canvas-mode-control" for="canvasModeToggle" title="Send synthetic keyboard events to the last canvas you clicked on the webpage">
        <span>Canvas mode</span>
        <span class="toggle-switch">
          <input type="checkbox" id="canvasModeToggle">
          <span class="toggle-slider"></span>
        </span>
      </label>
    </div>
    <div class="input-toolbar">
      <label class="typing-speed-compact" for="typingSpeed">
        <span>Speed</span>
        <input type="range" id="typingSpeed" min="30" max="150" value="60" aria-label="Typing speed">
      </label>
      <label class="human-mode-compact" for="humanModeToggle" title="Random pauses and typos when typing">
        <span>Human</span>
        <span class="toggle-switch">
          <input type="checkbox" id="humanModeToggle" checked>
          <span class="toggle-slider"></span>
        </span>
      </label>
      <div class="input-field-actions">
        <button type="button" id="removeInputBtn" class="add-input-btn remove-input-btn" title="Remove the last added text field" aria-label="Remove the last added text field" disabled>−</button>
        <button type="button" id="addInputBtn" class="add-input-btn" title="Add another text field" aria-label="Add another text field">+</button>
      </div>
    </div>
    <div class="snippet-library-toolbar">
      <div class="snippet-library-actions">
        <button type="button" id="importSnippetsBtn" class="library-btn">Import JSON</button>
        <button type="button" id="exportSnippetsBtn" class="library-btn">Export JSON</button>
        <input type="file" id="importSnippetsFile" accept=".json,application/json" hidden>
      </div>
      <div id="compatibilityStatus" class="compatibility-status" role="status" aria-live="polite" title="Website editors may ignore simulated input events.">
        C: click a page field to check
      </div>
    </div>
    <div id="inputFields" class="input-fields"></div>

    <template id="inputCardTemplate">
      <section class="input-card">
        <div class="snippet-heading-row">
          <input class="snippet-name" type="text" maxlength="60" aria-label="Snippet name" placeholder="Snippet name">
          <div class="snippet-order-actions">
            <button type="button" class="snippet-order-btn" data-action="move-up" aria-label="Move snippet up" title="Move snippet up">↑</button>
            <button type="button" class="snippet-order-btn" data-action="move-down" aria-label="Move snippet down" title="Move snippet down">↓</button>
          </div>
        </div>
        <div class="input-card-toolbar">
          <button type="button" class="primary-btn" data-action="start">▶ Start</button>
          <button type="button" class="secondary-btn stop-btn" data-action="stop" disabled>⏹ Stop</button>
          <button type="button" class="paste-btn" data-action="paste" title="Paste from clipboard">📋 Paste</button>
          <button type="button" class="clear-btn" data-action="clear" title="Clear text">🗑️ Clear</button>
        </div>
        <div class="text-input-container">
          <textarea class="typing-input" placeholder="Enter or paste text to type..."></textarea>
          <div class="character-count">0 chars</div>
        </div>
        <div class="progress-container">
          <div class="progress-bar"><div class="progress-fill"></div></div>
        </div>
      </section>
    </template>

    <footer class="panel-footer">
      <div class="footer-links">
        <a id="storeLink" href="#" target="_blank" rel="noreferrer">Get GhostType</a>
        <a href="https://github.com/GTekSD/GhostType" target="_blank" rel="noreferrer">GitHub</a>
        <a href="https://github.com/GTekSD/GhostType/issues/new" target="_blank" rel="noreferrer">Report a bug / feedback</a>
        <a href="mailto:gteksd.n00b@gmail.com">Support email</a>
      </div>
      <div class="footer-meta">
        <span class="developer-credit">Developed by Сухас Дхолз // GTekSD</span>
        <span id="versionLabel" class="version-label"></span>
      </div>
    </footer>
  </div>

  <script defer src="sidepanel.js"></script>
</body>
</html>
